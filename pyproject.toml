[project]
name = "tessera"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.38.27",
    "google-api-python-client>=2.161.0",
    "google-auth>=2.38.0",
    "openai>=1.63.0",
    "opencv-python>=4.11.0.86",
    "pdfminer>=20191125",
    "pdfplumber>=0.11.5",
    "pillow>=11.1.0",
    "pymupdf>=1.25.3",
    "s3fs>=0.4.2",
    "sf-hamilton[sdk,ui]>=1.87.0",
    "streamlit>=1.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.9.6",
]
